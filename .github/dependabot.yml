version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      android-test:
        patterns:
          - "*junit*"
          - "*robolectric*"
          - "*espresso*"
          - "*roborazzi*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
