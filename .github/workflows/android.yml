name: LANU Music Platform CI

on:
  push:
    branches: [ "main", "master", "fix/consolidated-p0-p1" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build, Test & Package Android App
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Verify Gradle
        run: gradle --version
      - name: Verify production catalog credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${JAMENDO_CLIENT_ID:-}" ]]; then
            echo "INFO: JAMENDO_CLIENT_ID is not configured; Audius is the default live catalog and Jamendo remains optional."
          fi
      - name: Verify live Audius catalog response and stream
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --get 'https://discoveryprovider.audius.co/v1/tracks/search' \
            --data-urlencode 'query=rock' \
            --data-urlencode 'limit=5')"
          count="$(jq '.data | length' <<<"${response}")"
          streamable="$(jq '[.data[] | select(.isStreamable == true or .isStreamable == "true") | select((.id // "") != "")] | length' <<<"${response}")"
          track_id="$(jq -r '[.data[] | select(.isStreamable == true or .isStreamable == "true") | select((.id // "") != "") | .id][0] // empty' <<<"${response}")"
          echo "Audius live smoke: results=${count}, streamable=${streamable}, track_id=${track_id}"
          [[ -n "${track_id}" ]]
          (( count > 0 ))
          (( streamable > 0 ))
          curl -fsSL -r 0-1 -o /dev/null "https://discoveryprovider.audius.co/v1/tracks/${track_id}/stream"
      - name: Verify Jamendo only when credential is configured
        if: env.JAMENDO_CLIENT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --get 'https://api.jamendo.com/v3.0/tracks/' \
            --data-urlencode "client_id=${JAMENDO_CLIENT_ID}" \
            --data-urlencode 'format=json' \
            --data-urlencode 'limit=5' \
            --data-urlencode 'type=single albumtrack' \
            --data-urlencode 'search=rock' \
            --data-urlencode 'audioformat=mp32')"
          code="$(jq -r '.headers.code // -1' <<<"${response}")"
          count="$(jq -r '.headers.results_count // 0' <<<"${response}")"
          playable="$(jq '[.results[] | select((.audio // "") != "" and (.name // "") != "" and (.artist_name // "") != "")] | length' <<<"${response}")"
          echo "Jamendo: headers.code=${code}, results_count=${count}, playable=${playable}"
          [[ "${code}" == "0" ]]
          (( count > 0 ))
          (( playable > 0 ))
      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Generate APK SHA-256
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-music-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: lanu-music-debug-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Publish release with APK and SHA-256
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lanu-music-${{ github.run_number }}-${{ github.sha }}
          name: LANU Music Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/app-debug.apk
            release/app-debug.apk.sha256
