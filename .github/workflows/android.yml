name: LANU Music Platform CI

on:
  push:
    branches: [ "main", "master", "fix/consolidated-p0-p1" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Avoid wasting CI on stale PR commits, but NEVER cancel published builds.
concurrency:
  group: lanu-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Package Android App
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      JAMENDO_COMMERCIAL_LICENSE_CONFIRMED: ${{ secrets.JAMENDO_COMMERCIAL_LICENSE_CONFIRMED }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Verify Gradle
        run: gradle --version
      - name: Verify production catalog credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${JAMENDO_CLIENT_ID:-}" ]]; then
            echo "INFO: JAMENDO_CLIENT_ID is not configured; Audius is the default live catalog and Jamendo remains optional."
          fi
      - name: Verify live Audius catalog response and stream
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --get 'https://discoveryprovider.audius.co/v1/tracks/search' \
            --data-urlencode 'query=rock' \
            --data-urlencode 'limit=5')"
          count="$(jq '.data | length' <<<"${response}")"
          streamable="$(jq '[.data[] | select((.is_streamable // .isStreamable // "") | tostring | ascii_downcase == "true") | select((.id // "") != "")] | length' <<<"${response}")"
          track_id="$(jq -r '[.data[] | select((.is_streamable // .isStreamable // "") | tostring | ascii_downcase == "true") | select((.id // "") != "") | .id][0] // empty' <<<"${response}")"
          echo "Audius live smoke: results=${count}, streamable=${streamable}, track_id=${track_id}"
          (( count > 0 ))
          (( streamable > 0 ))
          [[ -n "${track_id}" ]]
          curl -fsSL -r 0-1 -o /dev/null "https://discoveryprovider.audius.co/v1/tracks/${track_id}/stream"
      - name: Verify 10 live artists and 20 live tracks end-to-end
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_live_catalog.sh
          scripts/verify_live_catalog.sh
      - name: Verify Jamendo only when credential and commercial license are configured
        if: env.JAMENDO_CLIENT_ID != '' && env.JAMENDO_COMMERCIAL_LICENSE_CONFIRMED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --get 'https://api.jamendo.com/v3.0/tracks/' \
            --data-urlencode "client_id=${JAMENDO_CLIENT_ID}" \
            --data-urlencode 'format=json' \
            --data-urlencode 'limit=5' \
            --data-urlencode 'type=single albumtrack' \
            --data-urlencode 'search=rock' \
            --data-urlencode 'audioformat=mp32')"
          code="$(jq -r '.headers.code // -1' <<<"${response}")"
          count="$(jq -r '.headers.results_count // 0' <<<"${response}")"
          playable="$(jq '[.results[] | select((.audio // "") != "" and (.name // "") != "" and (.artist_name // "") != "")] | length' <<<"${response}")"
          echo "Jamendo: headers.code=${code}, results_count=${count}, playable=${playable}"
          [[ "${code}" == "0" ]]
          (( count > 0 ))
          (( playable > 0 ))
      - name: Report Jamendo commercial licensing gate
        shell: bash
        run: |
          if [[ "${JAMENDO_COMMERCIAL_LICENSE_CONFIRMED:-}" == "true" ]]; then
            echo "Jamendo commercial license gate: ENABLED"
          else
            echo "Jamendo commercial license gate: DISABLED (safe default); Audius is the default full-stream catalog."
          fi
      - name: Verify repository hygiene and guardrails
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_repository_hygiene.py
          python3 -m unittest discover -s scripts -p 'test_repository_hygiene.py'
          python3 -m unittest discover -s scripts -p 'test_release_workflow_integrity.py'
      - name: Android OEM compatibility policy and read-only device script validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_android_oem_compatibility.py
          bash -n scripts/android_device_readonly_smoke.sh
          bash scripts/android_device_readonly_smoke.sh --help
          bash -n scripts/android-smoke.sh
          bash scripts/android-smoke.sh --help
          python3 -m unittest discover -s scripts -p 'test_android_smoke_safety.py'
      - name: Verify installed APK signing certificate gate unit tests
        run: python3 -m unittest discover -s scripts -p 'test_verify_installed_signing_certificate.py'
      - name: Android Lint quality gate
        shell: bash
        run: |
          set +e
          gradle lintDebug --stacktrace
          outcome=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -f "${report}" ]]; then
            echo "::group::Android Lint findings"
            grep -E ':[0-9]+: (Error|Warning):' "${report}" || true
            echo "::endgroup::"
          fi
          exit "${outcome}"
      - name: Archive Lint findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanu-android-lint-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Report failed unit-test assertions
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/test-results/testDebugUnitTest")
          found = 0
          for filename in sorted(root.glob("TEST-*.xml")):
              try:
                  suite = ET.parse(filename).getroot()
              except (ET.ParseError, OSError):
                  continue
              for test in suite.findall(".//testcase"):
                  for issue in list(test.findall("failure")) + list(test.findall("error")):
                      found += 1
                      print(f"FAILED {test.get('classname')}::{test.get('name')}")
                      print("TYPE:", issue.get("type", "unknown"))
                      print("MESSAGE:", str(issue.get("message", ""))[:600])
                      print("STACK:", (issue.text or "")[:1800])
          if found == 0:
              print("No failed unit-test XML found; failure might belong to another CI step.")
          PY
      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Release R8, resource shrinking and signature smoke build
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp -d "${RUNNER_TEMP}/lanu-r8-smoke-XXXXXX")"
          trap 'rm -rf "${temporary}"' EXIT
          keytool -genkeypair -noprompt \
            -alias ci-smoke -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=LANU CI smoke only" \
            -keystore "${temporary}/lanu-ci.jks" \
            -storepass "temporary-ci-smoke-2026" -keypass "temporary-ci-smoke-2026"
          KEYSTORE_PATH="${temporary}/lanu-ci.jks" \
          STORE_PASSWORD="temporary-ci-smoke-2026" \
          KEY_PASSWORD="temporary-ci-smoke-2026" \
          KEY_ALIAS="ci-smoke" \
          gradle --no-daemon assembleRelease --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          [[ -s "${apk}" && -s "${mapping}" ]]
          signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "${signer}" verify --verbose "${apk}"
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          package="$("${aapt}" dump badging "${apk}" | grep "^package: " | head -n 1)"
          [[ "${package}" == *"name='com.aistudio.lanumusic.kpxzqa'"* ]]
          [[ "${package}" == *"versionCode='${GITHUB_RUN_NUMBER}'"* ]]
          echo "R8, shrinking, APK signing and version identity smoke checks passed."

      - name: Generate APK SHA-256
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-music-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            build/live-catalog-verification.tsv
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: lanu-music-debug-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Publish release with resilient asset upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: lanu-music-${{ github.run_number }}-${{ github.sha }}
          RELEASE_NAME: LANU Music Build ${{ github.run_number }}
        run: |
          set -euo pipefail

          apk_path="$(find release -type f -name 'app-debug.apk' -print -quit)"
          sha_path="$(find release -type f -name 'app-debug.apk.sha256' -print -quit)"
          [[ -n "${apk_path}" && -f "${apk_path}" ]]
          [[ -n "${sha_path}" && -f "${sha_path}" ]]
          echo "Resolved APK artifact: ${apk_path}"
          echo "Resolved SHA-256 artifact: ${sha_path}"

          if ! gh release view --repo "${GH_REPO}" "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create --repo "${GH_REPO}" "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" \
              --generate-notes
          fi

          for attempt in 1 2 3 4; do
            echo "Release asset upload attempt ${attempt}/4"
            if gh release upload --repo "${GH_REPO}" "${TAG_NAME}" \
              "${apk_path}" \
              "${sha_path}" \
              --clobber; then
              echo "Release assets uploaded successfully."
              break
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "ERROR: GitHub Release asset upload failed after 4 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

          assets="$(gh release view --repo "${GH_REPO}" "${TAG_NAME}" --json assets --jq '.assets[].name')"
          grep -Fxq 'app-debug.apk' <<<"${assets}"
          grep -Fxq 'app-debug.apk.sha256' <<<"${assets}"
          remote_digest="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets[] | select(.name == "app-debug.apk") | .digest')"
          expected_digest="sha256:$(sha256sum "${apk_path}" | cut -d ' ' -f1)"
          [[ "${remote_digest}" == "${expected_digest}" ]]
          remote_checksum_digest="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets[] | select(.name == "app-debug.apk.sha256") | .digest')"
          expected_checksum_digest="sha256:$(sha256sum "${sha_path}" | cut -d ' ' -f1)"
          [[ "${remote_checksum_digest}" == "${expected_checksum_digest}" ]]
          # Verify actual bytes retrieved through the public release asset endpoints,
          # not only the API-reported digest metadata.
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "${verification_dir}"' EXIT
          gh release download --repo "${GH_REPO}" "${TAG_NAME}" \
            --pattern 'app-debug.apk' --pattern 'app-debug.apk.sha256' \
            --dir "${verification_dir}"
          [[ -s "${verification_dir}/app-debug.apk" ]]
          [[ -s "${verification_dir}/app-debug.apk.sha256" ]]
          cmp "${apk_path}" "${verification_dir}/app-debug.apk"
          cmp "${sha_path}" "${verification_dir}/app-debug.apk.sha256"
          published_sha="$(awk 'NR==1 {print $1}' "${verification_dir}/app-debug.apk.sha256")"
          [[ "${published_sha}" =~ ^[0-9a-f]{64}$ ]]
          calculated_sha="$(sha256sum "${verification_dir}/app-debug.apk" | cut -d ' ' -f1)"
          [[ "${published_sha}" == "${calculated_sha}" ]]
          echo "Verified downloaded release APK, checksum file and SHA-256 against actual bytes."
          echo "Verified release assets:"
          printf '%s\n' "${assets}"

  signed_release:
    name: Publish optional securely signed release APK
    needs: [build, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LANU_SIGNING_KEYSTORE_BASE64: ${{ secrets.LANU_SIGNING_KEYSTORE_BASE64 }}
      LANU_SIGNING_STORE_PASSWORD: ${{ secrets.LANU_SIGNING_STORE_PASSWORD }}
      LANU_SIGNING_KEY_PASSWORD: ${{ secrets.LANU_SIGNING_KEY_PASSWORD }}
      LANU_SIGNING_KEY_ALIAS: ${{ secrets.LANU_SIGNING_KEY_ALIAS }}
    steps:
      - name: Check signing credentials without exposing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LANU_SIGNING_KEYSTORE_BASE64}" &&
                -n "${LANU_SIGNING_STORE_PASSWORD}" &&
                -n "${LANU_SIGNING_KEY_PASSWORD}" &&
                -n "${LANU_SIGNING_KEY_ALIAS}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Stable signing secrets not configured; only debug preview is published."
          fi
      - name: Report production signing readiness
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          {
            echo "### Production: NOT READY"
            echo
            echo "Signing credentials missing. Only debug preview was published."
            echo "The optional signing job can be green even when signing steps are skipped."
            echo "Production OTA requires signing identity pinning, installed-device certificate match and real-device data-retention validation."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::warning::Production signing skipped; debug APK only."
      - name: Checkout verified main commit
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Install Java for signed build
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Gradle
        if: steps.signing.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Restore signing key outside repository
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lanu-release.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${LANU_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          [[ -s "${KEYSTORE_PATH}" ]]
      - name: Assemble signed release
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lanu-release.jks
          STORE_PASSWORD: ${{ secrets.LANU_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LANU_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LANU_SIGNING_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: Verify actual APK signature and hash
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          [[ -s "${apk}" ]]
          signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "${signer}" ]]
          cert_output="$("${signer}" verify --verbose --print-certs "${apk}")"
          printf '%s\n' "${cert_output}"
          # Refuse publishing a release that cannot update LANU or has the wrong versionCode.
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          [[ -x "${aapt}" ]]
          package_line="$("${aapt}" dump badging "${apk}" | grep '^package: ' | head -n 1)"
          [[ "${package_line}" == *"name='com.aistudio.lanumusic.kpxzqa'"* ]]
          [[ "${package_line}" == *"versionCode='${GITHUB_RUN_NUMBER}'"* ]]
          [[ "${cert_output}" == *"certificate SHA-256 digest:"* ]]
          echo "Signed APK identity and CI versionCode verified."
          sha256sum "${apk}" > "${apk}.sha256"
          unzip -t "${apk}" > /dev/null
      - name: Pin signing certificate when fingerprint is configured
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ vars.LANU_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_FINGERPRINT}" ]]; then
            echo "::error::Production signing requires repository variable LANU_SIGNING_CERT_SHA256. No unpinned release is allowed."
            exit 1
          else
            apk="app/build/outputs/apk/release/app-release.apk"
            signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
            actual="$("${signer}" verify --print-certs "${apk}" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
            expected="$(tr '[:upper:]' '[:lower:]' <<<"${EXPECTED_FINGERPRINT}" | tr -d ':[:space:]')"
            [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::Signing certificate changed unexpectedly. Publishing is blocked."
              exit 1
            }
            echo "Pinned signing certificate verified."
          fi
      - name: Require installed-device certificate match for safe in-place upgrades
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          INSTALLED_FINGERPRINT: ${{ vars.LANU_INSTALLED_APP_CERT_SHA256 }}
          PINNED_FINGERPRINT: ${{ vars.LANU_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          signer="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          actual="$("${signer}" verify --print-certs "${apk}" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          python3 scripts/verify_installed_signing_certificate.py \
            --installed "${INSTALLED_FINGERPRINT}" \
            --pinned "${PINNED_FINGERPRINT}" \
            --actual "${actual}"
      - name: Attach signed APK only after verification
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: lanu-music-${{ github.run_number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          gh release view --repo "${GH_REPO}" "${TAG_NAME}" > /dev/null
          for attempt in 1 2 3; do
            if gh release upload --repo "${GH_REPO}" "${TAG_NAME}" \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release.apk.sha256 --clobber; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          assets="$(gh release view --repo "${GH_REPO}" "${TAG_NAME}" --json assets --jq '.assets[].name')"
          grep -Fxq 'app-release.apk' <<<"${assets}"
          grep -Fxq 'app-release.apk.sha256' <<<"${assets}"
          # Read the digest BACK from the public GitHub release, not only the runner.
          remote_digest="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets[] | select(.name == "app-release.apk") | .digest')"
          remote_checksum_digest="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets[] | select(.name == "app-release.apk.sha256") | .digest')"
          expected_digest="sha256:$(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f1)"
          expected_checksum_digest="sha256:$(sha256sum app/build/outputs/apk/release/app-release.apk.sha256 | cut -d ' ' -f1)"
          [[ "${remote_digest}" == "${expected_digest}" ]]
          [[ "${remote_checksum_digest}" == "${expected_checksum_digest}" ]]
          # GitHub API metadata alone cannot prove assets are downloadable or
          # match the original bytes. Re-download BOTH signed release assets.
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "${verification_dir}"' EXIT
          gh release download --repo "${GH_REPO}" "${TAG_NAME}" \
            --pattern 'app-release.apk' --pattern 'app-release.apk.sha256' \
            --dir "${verification_dir}"
          [[ -s "${verification_dir}/app-release.apk" ]]
          [[ -s "${verification_dir}/app-release.apk.sha256" ]]
          cmp app/build/outputs/apk/release/app-release.apk "${verification_dir}/app-release.apk"
          cmp app/build/outputs/apk/release/app-release.apk.sha256 "${verification_dir}/app-release.apk.sha256"
          published_sha="$(awk 'NR==1 {print $1}' "${verification_dir}/app-release.apk.sha256")"
          [[ "${published_sha}" =~ ^[0-9a-f]{64}$ ]]
          calculated_sha="$(sha256sum "${verification_dir}/app-release.apk" | cut -d ' ' -f1)"
          [[ "${published_sha}" == "${calculated_sha}" ]]
          echo "Downloaded signed APK, checksum sidecar and public release bytes verified."
      - name: Report verified signed release
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            echo "### Signed APK: signing checks passed"
            echo
            echo "APK signing, pinned and installed signer, versionCode and release SHA-256 matched."
            echo "Real-device data-preserving OTA testing remains separately required."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Erase temporary signing key
        if: always() && steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lanu-release.jks
        shell: bash
        run: rm -f "${KEYSTORE_PATH}"
