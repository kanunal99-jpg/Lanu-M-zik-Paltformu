name: LANU Music Platform CI

on:
  push:
    branches: [ "main", "master", "fix/consolidated-p0-p1" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Verify Gradle
        run: gradle --version
      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Generate APK SHA-256
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-music-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
