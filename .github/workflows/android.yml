name: LANU Music Platform CI

on:
  push:
    branches: [ "main", "master", "fix/consolidated-p0-p1" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build, Test & Package Android App
    runs-on: ubuntu-latest
    env:
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Verify Gradle
        run: gradle --version
      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace
      - name: Generate APK SHA-256
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-music-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: lanu-music-debug-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Publish release with APK and SHA-256
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lanu-music-${{ github.run_number }}-${{ github.sha }}
          name: LANU Music Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/app-debug.apk
            release/app-debug.apk.sha256
